
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tyre/Battery Letter Head</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pizzip/3.1.7/pizzip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.49.0/docxtemplater.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="heads-templates.js"></script>
  <script>
    // Fallback script loader if primary CDN is blocked by extensions/ad-blockers
    function loadScriptFallback(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function ensureLibrariesLoaded() {
      if (typeof window.PizZip === 'undefined') {
        try {
          await loadScriptFallback('https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js');
        } catch (e) {
          await loadScriptFallback('https://unpkg.com/pizzip@3.1.7/dist/pizzip.min.js').catch(() => {});
        }
      }
      if (typeof window.docxtemplater === 'undefined') {
        try {
          await loadScriptFallback('https://cdn.jsdelivr.net/npm/docxtemplater@3.49.0/build/docxtemplater.js');
        } catch (e) {
          await loadScriptFallback('https://unpkg.com/docxtemplater@3.49.0/build/docxtemplater.js').catch(() => {});
        }
      }
      if (typeof window.saveAs === 'undefined') {
        try {
          await loadScriptFallback('https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js');
        } catch (e) {
          await loadScriptFallback('https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js').catch(() => {});
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    /* CSS Variables matching main website theme system */
    :root {
      --bg-page: #f4f4f2;
      --bg-card: #ffffff;
      --bg-input: #ffffff;
      --bg-hover: #f0f0ee;
      --bg-active: #e3e3df;

      --text-main: #181816;
      --text-label: #181816;
      --text-muted: #6a6a67;
      --text-placeholder: #9a9a97;

      --border-light: #e3e3df;
      --border-input: #e3e3df;
      --border-focus: #002C5F;

      --accent-bg: #002C5F;
      --accent-text: #ffffff;
      --focus-ring: rgba(0, 44, 95, 0.1);
      --danger-color: #ef4444;
    }

    [data-theme=dark] {
      --bg-page: #111110;
      --bg-card: #1c1c1a;
      --bg-input: #1c1c1a;
      --bg-hover: #232321;
      --bg-active: #2d2d2b;

      --text-main: #f0f0ee;
      --text-label: #f0f0ee;
      --text-muted: #888885;
      --text-placeholder: #525250;

      --border-light: #2d2d2b;
      --border-input: #2d2d2b;
      --border-focus: #4D8FD6;

      --accent-bg: #4D8FD6;
      --accent-text: #111110;
      --focus-ring: rgba(77, 143, 214, 0.2);
      --danger-color: #f87171;
    }

    /* ── Modern Scrollbar ── */
    * {
      scrollbar-width: thin;
      scrollbar-color: var(--bg-active) transparent;
    }

    *::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background: var(--bg-active);
      border-radius: 99px;
    }

    *::-webkit-scrollbar-thumb:hover {
      background: var(--border-input);
    }

    /* ── Stepper ── */
    .stepper-container {
      padding: 12px 28px;
      border-bottom: 1px solid var(--border-light);
      background: color-mix(in srgb, var(--bg-card) 88%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 900;
    }

    .stepper {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 8px;
      transition: all .18s;
      min-width: 0;
    }

    .step.done {
      background: rgba(0, 44, 95, .06);
      border-color: var(--accent-bg);
    }

    [data-theme=dark] .step.done {
      background: rgba(77, 143, 214, .1);
    }

    .step.active {
      border-color: var(--accent-bg);
    }

    .step-n {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bg-hover);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .step.done .step-n,
    .step.active .step-n {
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .step-t {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-s {
      font-size: 9.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media(max-width:640px) {
      .stepper-container {
        padding: 10px 14px;
      }

      .step {
        padding: 7px 7px;
        gap: 5px;
      }

      .step-n {
        width: 20px;
        height: 20px;
        font-size: 9px;
      }

      .step-t {
        font-size: 10px;
      }

      .step-s {
        font-size: 9px;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px 80px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      background: var(--bg-card);
      border-radius: 18px;
      width: 100%;
      max-width: 840px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.08), 0 2px 6px -1px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-light);
    }

    /* ── Sticky Stepper ── */
    .stepper-wrap {
      position: sticky;
      top: 0;
      z-index: 900;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
    }

    /* ── Page Jumpers ── */
    .page-jumper {
      position: fixed;
      right: 16px;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .page-jumper {
      bottom: 92px;
    }

    .pj-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .2);
      transition: all .25s cubic-bezier(.4, 0, .2, 1);
      outline: none;
      background: var(--accent-bg);
      color: var(--accent-text);
    }

    .pj-btn:hover {
      transform: scale(1.12);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .3);
    }

    .pj-btn:active {
      transform: scale(.95);
    }

    .pj-btn:focus {
      box-shadow: 0 0 0 3px var(--focus-ring), 0 4px 14px rgba(0, 0, 0, .2);
    }

    .pj-btn.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
    }

    @media(max-width:640px) {
      .pj-btn {
        width: 38px;
        height: 38px;
      }

      .page-jumper {
        right: 10px;
        bottom: 70px;
      }
    }

    .card-header {
      padding: 26px 32px 22px;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .card-header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--accent-bg);
      color: var(--accent-text);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(0, 44, 95, 0.22);
    }

    .card-header h1 {
      font-size: 21px;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .card-header p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Modern Segmented Control Toolbar */
    .mode-wrap {
      padding: 16px 32px;
      background: var(--bg-hover);
      border-bottom: 1px solid var(--border-light);
      display: none;
    }

    .mode-wrap.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .mode-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .mode-btns {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 11px;
      flex-wrap: wrap;
    }

    .mode-btn {
      padding: 0 14px;
      min-width: auto;
      height: 34px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all .18s ease;
      outline: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
    }

    .mode-btn:focus {
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .mode-btn:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .mode-btn.active {
      background: var(--accent-bg);
      border-color: var(--accent-bg);
      color: var(--accent-text);
      box-shadow: 0 2px 6px rgba(0, 44, 95, 0.2);
    }

    /* History Section */
    .history-wrap {
      padding: 24px 32px 32px;
      display: none;
    }

    .history-wrap.show {
      display: block;
    }

    .hist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .hist-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .hist-clr {
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
      padding: 0;
      outline: none;
    }

    .hist-clr:hover,
    .hist-clr:focus {
      color: var(--danger-color);
    }

    .search-input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: all 0.2s;
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .search-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-input);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .search-input::placeholder {
      color: var(--text-placeholder);
    }

    .hist-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg-input);
      transition: all 0.2s;
      outline: none;
    }

    .hist-item:hover,
    .hist-item:focus {
      border-color: var(--border-input);
      background: var(--bg-hover);
    }

    .hi-info {
      flex: 1;
      min-width: 0;
    }

    .hi-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hi-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hi-mode {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .hi-mode.tyre {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
    }

    .hi-mode.battery {
      background: rgba(245, 158, 11, 0.15);
      color: #d97706;
    }

    .hi-del {
      background: none;
      border: none;
      color: var(--border-input);
      cursor: pointer;
      transition: color 0.2s;
      display: flex;
      align-items: center;
      outline: none;
    }

    .hi-del:hover,
    .hi-del:focus {
      color: var(--danger-color);
    }

    /* Forms - Modern Section Cards */
    .form-section {
      margin: 20px 32px 0;
      padding: 20px 22px 22px;
      border: 1px solid var(--border-light);
      border-radius: 14px;
      background: var(--bg-card);
    }

    .sec-lbl {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--accent-bg);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-light);
      letter-spacing: 0.07em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sec-lbl::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-bg);
      flex-shrink: 0;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    .field-col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .field-col label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .field-col input {
      height: 44px;
      border: 1px solid var(--border-input);
      border-radius: 10px;
      padding: 0 14px;
      font-size: 14px;
      color: var(--text-main);
      background: var(--bg-hover);
      transition: all 0.18s ease;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
    }

    .field-col input:hover {
      border-color: var(--text-placeholder);
    }

    .field-col input:focus {
      background: var(--bg-input);
    }

    .field-col input::placeholder {
      color: var(--text-placeholder);
    }

    .field-col input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .field-col input.pre {
      color: var(--text-muted);
    }

    /* Custom Animated Select / Dropdown */
    .custom-select-wrap {
      position: relative;
      user-select: none;
      width: 100%;
    }

    .custom-select-trigger {
      height: 44px;
      border: 1px solid var(--border-input);
      border-radius: 10px;
      padding: 0 14px;
      background: var(--bg-hover);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.18s ease;
      width: 100%;
      outline: none;
    }

    .custom-select-trigger:focus-within,
    .custom-select-trigger.active {
      background: var(--bg-input);
    }

    .custom-select-trigger:hover {
      border-color: var(--text-placeholder);
    }

    .custom-select-trigger:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .custom-select-trigger:focus-within,
    .custom-select-trigger.active {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .field-col .cs-input {
      flex: 1;
      height: 100%;
      border: none;
      border-radius: 0;
      padding: 0 8px 0 0;
      font-size: 14px;
      color: var(--text-main);
      background: transparent;
      outline: none;
      box-shadow: none;
      width: 100%;
      min-width: 0;
      font-family: 'Inter', sans-serif;
    }

    .field-col .cs-input:focus {
      border: none;
      box-shadow: none;
    }

    .cs-arr {
      padding: 4px;
      margin-right: -4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cs-empty {
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.15s;
    }

    .cs-empty:hover {
      background: var(--bg-hover);
      color: var(--text-main);
    }

    .cs-empty strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .cs-hl {
      background: rgba(0, 44, 95, 0.14);
      color: var(--accent-bg);
      font-weight: 600;
      border-radius: 3px;
      padding: 0 2px;
    }

    [data-theme=dark] .cs-hl {
      background: rgba(77, 143, 214, 0.25);
      color: #8cc0f8;
    }

    .custom-select-opts.flip-up {
      top: auto;
      bottom: calc(100% + 6px);
      transform-origin: bottom;
      transform: translateY(10px) scaleY(0.95);
    }

    .custom-select-opts.flip-up.open {
      transform: translateY(0) scaleY(1);
    }

    .cs-val {
      font-size: 14px;
      color: var(--text-main);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-right: 10px;
    }

    .cs-val.empty {
      color: var(--text-placeholder);
    }

    .cs-arr {
      color: var(--text-placeholder);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
    }

    .custom-select-trigger.active .cs-arr {
      transform: rotate(180deg);
      color: var(--text-main);
    }

    .custom-select-opts {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 500;
      background: var(--bg-card);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 5px;
      box-shadow: 0 14px 32px -6px rgba(0, 0, 0, 0.18);
      max-height: 220px;
      overflow-y: auto;
      opacity: 0;
      transform: translateY(-10px) scaleY(0.95);
      transform-origin: top;
      pointer-events: none;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .custom-select-opts.open {
      opacity: 1;
      transform: translateY(0) scaleY(1);
      pointer-events: all;
    }

    .cs-opt {
      padding: 10px 12px;
      font-size: 13.5px;
      color: var(--text-main);
      cursor: pointer;
      border-radius: 8px;
      transition: background 0.14s;
      outline: none;
    }

    .cs-opt:hover,
    .cs-opt:focus {
      background: var(--bg-hover);
      font-weight: 500;
    }

    /* Date picker */
    .date-trigger {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      cursor: pointer;
      user-select: none;
      gap: 8px;
      border: 1px solid var(--border-input);
      border-radius: 10px;
      background: var(--bg-hover);
      transition: all 0.18s ease;
      position: relative;
      width: 100%;
      outline: none;
    }

    .date-trigger:focus-within,
    .date-trigger.active {
      background: var(--bg-input);
    }

    .date-trigger:hover {
      border-color: var(--text-placeholder);
    }

    .date-trigger:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .date-trigger.active {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    .date-icon {
      color: var(--text-placeholder);
      display: flex;
      align-items: center;
    }

    .dval {
      font-size: 14px;
      color: var(--text-main);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dval.empty {
      color: var(--text-placeholder);
    }

    /* Calendar Popup */
    .cal-pop {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 400;
      background: var(--bg-card);
      border: 1px solid var(--border-input);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      width: 260px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .cal-pop.flip-up {
      top: auto;

      color: var(--text-main);
    }

      gap: 2px;

    .cal-grid.years {

      gap: 8px;

</head>

    // ─────────────────────────────────────────────────────────────────

    function customConfirm(message, okText = "Yes") {
      return new Promise((resolve) => {
        const modal = document.getElementById('customModal');
        const msgEl = document.getElementById('modalMsg');
        const btnOk = document.getElementById('modalOk');
        const btnCancel = document.getElementById('modalCancel');

        msgEl.textContent = message;
        btnOk.textContent = okText;

        const cleanup = () => {
          modal.classList.remove('show');
          btnOk.removeEventListener('click', onOk);
          btnCancel.removeEventListener('click', onCancel);
          modal.removeEventListener('click', onOverlay);
          document.removeEventListener('keydown', onKey);
        };

        const onOk = () => { cleanup(); resolve(true); };
        const onCancel = () => { cleanup(); resolve(false); };
        const onOverlay = (e) => { if (e.target === modal) onCancel(); };
        const onKey = (e) => { if (e.key === 'Escape') onCancel(); };

        btnOk.addEventListener('click', onOk);
        btnCancel.addEventListener('click', onCancel);
        modal.addEventListener('click', onOverlay);
        document.addEventListener('keydown', onKey);

        modal.classList.add('show');
        btnCancel.focus();
      });

    // ─────────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────────
    let templateBuffers = { new: null, old: null };
    let currentMode = 'tyre';
    let currentFormat = 'new';
    const CAL = {};
    let HISTORY = [];
    try { HISTORY = JSON.parse(localStorage.getItem('inj_hist') || '[]'); } catch (e) { }

    // DOM elements
    const formWrap = document.getElementById('formWrap');
    const actionsBar = document.getElementById('actionsBar');
    const btnClear = document.getElementById('btnClear');
    const btnInject = document.getElementById('btnInject');

    const histWrap = document.getElementById('histWrap');
    const histList = document.getElementById('histList');
    const historySearch = document.getElementById('historySearch');
    let formDraft = {};

    // Helpers
    const pad = n => String(n).padStart(2, '0');
    const fmtDash = d => pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear();
    const fmtSlash = d => pad(d.getDate()) + ' / ' + pad(d.getMonth() + 1) + ' / ' + d.getFullYear();
    const parseManualDate = (str) => {
      const m = String(str || '').trim().match(/^(\d{1,2})\s*[-/]\s*(\d{1,2})\s*[-/]\s*(\d{4})$/);
      if (!m) return null;
      const day = +m[1], mon = +m[2], yr = +m[3];
      const d = new Date(yr, mon - 1, day);
      if (isNaN(d) || d.getFullYear() !== yr || d.getMonth() !== mon - 1 || d.getDate() !== day) return null;
      return d;
    };
    const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const getGroups = () => currentMode === 'tyre' ? TYRE_FIELDS : BATTERY_FIELDS;
    const allFields = () => getGroups().flatMap(g => g.fields);
    const dateFields = () => allFields().filter(f => f.type === 'date');
    const collectData = () => {
      const entry = { mode: currentMode, format: currentFormat };
      allFields().forEach(f => {
        if (f.type === 'date') {
          const di = document.getElementById('di_' + f.id);
          const raw = di ? di.value.trim() : '';
          const parsed = parseManualDate(raw);
          const val = parsed ? (f.fmt === 'slash' ? fmtSlash(parsed) : fmtDash(parsed)) : raw;
          if (val) entry[f.id] = val;
        } else {
          const el = document.getElementById(f.id);
          const val = el?.value?.trim() || '';
          if (val) entry[f.id] = val;
        }
      });
      return entry;
    };

    function snapshotCurrentForm() {
      if (currentMode === 'history') return;
      allFields().forEach(f => {
        if (f.type === 'date') {
          const di = document.getElementById('di_' + f.id);
          if (di) formDraft[f.id] = di.value.trim();
        } else {
          const el = document.getElementById(f.id);
          if (!el) return;
          if (f.id === 'subject' && (el.value.trim() === 'Tyre Bulge Problem While Driving' || el.value.trim() === 'Vehicle starting problem issue.')) return;
          formDraft[f.id] = el.value;
        }
      });
    }

    function restoreDraftToForm() {
      allFields().forEach(f => {
        const saved = formDraft[f.id];
        if (saved === undefined || saved === '') return;
        if (f.type === 'date') {
          const di = document.getElementById('di_' + f.id);
          if (di) di.value = saved;
          const d = parseManualDate(saved);
          if (d) {
            if (!CAL[f.id]) CAL[f.id] = {};

          const el = document.getElementById(f.id);

            el.value = saved;
            el.classList.remove('pre');

    // Keyboard Interaction Helper
    const handleKeyClick = (el, action) => {

    // ─────────────────────────────────────────────────────────────────
    // INITIALIZE & FETCH DOCUMENT ON LOAD
    // ─────────────────────────────────────────────────────────────────
    // Base64 helper for offline / file:// protocol loading
    function b64ToArrayBuffer(b64) {
      const binaryString = window.atob(b64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    async function loadTemplate(format) {
      const filename = (format === 'new') ? 'heads.docx' : 'oldheads.docx';
      if (templateBuffers[format]) return;

      // Check for pre-bundled Base64 template first
      const b64 = (format === 'new') ? window.HEADS_DOCX_B64 : window.OLDHEADS_DOCX_B64;
      if (b64) {
        try {
          templateBuffers[format] = b64ToArrayBuffer(b64);
          clearStatus();
          return;
        } catch (e) {
          console.warn("Could not parse embedded template, trying fetch fallback", e);
        }
      }

      formWrap.innerHTML = `<div class="no-file-msg">Fetching template (${filename})...</div>`;
      try {
        const response = await fetch(filename);
        if (!response.ok) throw new Error('File not found');
        templateBuffers[format] = await response.arrayBuffer();
        clearStatus();
      } catch (err) {
        showStatus(`Error: Could not load ${filename} from the server.`, 'error');
        formWrap.innerHTML = `<div class="no-file-msg">Template ${filename} missing. Please check your repository.</div>`;
        throw err;
      }
    }

    async function setFormat(format) {
      snapshotCurrentForm();
      currentFormat = format;
      document.getElementById('formatNew').classList.toggle('active', format === 'new');
      document.getElementById('formatOld').classList.toggle('active', format === 'old');

      try {
        await loadTemplate(format);
      } catch (err) {
        console.warn("Template switch load error", err);
      }
      if (currentMode !== 'history') {
        setMode(currentMode);
      }
    }

    async function init() {
      if (modeWrap) modeWrap.classList.add('show');
      formWrap.addEventListener('input', updateStepper);
      try {
        await loadTemplate('new');
      } catch (err) {
        console.error("Template buffer load error, building UI with offline fallback", err);
      }
      try {
        setMode('tyre');
        clearStatus();
      } catch (err) {
        console.error("Initial setMode failed", err);
      }
    }

    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }

    function setMode(mode) {
      if (currentMode !== 'history') snapshotCurrentForm();
      currentMode = mode;
      document.getElementById('modeTyre').classList.toggle('active', mode === 'tyre');
      document.getElementById('modeBattery').classList.toggle('active', mode === 'battery');
      document.getElementById('modeHistory').classList.toggle('active', mode === 'history');
      const sw = document.getElementById('stepperWrap');
      if (mode === 'history') {
        formWrap.style.display = 'none';
        actionsBar.style.display = 'none';
        histWrap.classList.add('show');
        if (sw) sw.style.display = 'none';
        renderHistory();
      } else {
        histWrap.classList.remove('show');
        formWrap.style.display = 'block';
        actionsBar.style.display = 'flex';
        if (sw) sw.style.display = 'block';
        buildForm();
        restoreDraftToForm();
        requestAnimationFrame(updateStepper);
      }
    }

    function lhSaveEntry() {
      try { const d = collectData(); saveHistory(d); const s = document.getElementById('status'); if (s) { s.textContent = 'Entry saved'; s.className = 'status success'; setTimeout(() => { s.textContent = ''; s.className = 'status'; }, 2500); } } catch (e) { }
    }

    // ─── SMART PROGRESS ───
    function updateStepper() {
      if (currentMode === 'history') return;
      // Step 1 done: mode chosen (always true when form visible) + recipient selected
      const recipient = document.getElementById('recipient');
      const s1done = !!(recipient && recipient.value.trim());
      // Step 2 done: custName + regNo filled
      const custName = document.getElementById('custName');
      const regNo = document.getElementById('regNo');
      const s2done = !!(custName && custName.value.trim() && regNo && regNo.value.trim());
      // Step 3 done: s1+s2 + date filled
      const dateVal = CAL['date']?.date || (() => { const di = document.getElementById('di_date'); return di && di.value.trim() ? di.value : null; })();
      const s3done = s1done && s2done && !!dateVal;
      const doneMap = [s1done, s2done, s3done];
      // Scroll-based active
      const sections = Array.from(document.querySelectorAll('.form-section'));
      const vpm = window.innerHeight / 2;
      let activeStep = 1;
      sections.forEach((sec, idx) => {
        const r = sec.getBoundingClientRect();
        if (r.top < vpm && r.bottom > 0) activeStep = Math.min(idx + 1, 3);
      });
      for (let i = 1; i <= 3; i++) {
        const st = document.getElementById('lh-st' + i), sn = document.getElementById('lh-sn' + i);
        if (!st || !sn) continue;
        if (doneMap[i - 1]) {
          st.className = 'step done';
          sn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>';
        } else {
          st.className = 'step' + (i === activeStep ? ' active' : '');
          sn.textContent = i;
        }
      }
      if (filledCountEl) {
        const fields = allFields();
        const filled = fields.filter(f => {
          const el = f.type === 'date' ? document.getElementById('di_' + f.id) : document.getElementById(f.id);
          return !!(el && el.value.trim());
        }).length;
        filledCountEl.textContent = `${filled} / ${fields.length} filled`;
      }
    }

    // ─── PAGE JUMPERS ───
    (function () {
      const jumperHTML = `<div class="page-jumper" id="pageJumper">
    <button class="pj-btn hidden" id="pjTop" title="Go to top" tabindex="0" aria-label="Scroll to top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
    </button>
    <button class="pj-btn hidden" id="pjBottom" title="Go to bottom" tabindex="0" aria-label="Scroll to bottom">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  </div>`;
      document.body.insertAdjacentHTML('beforeend', jumperHTML);
      const topBtn = document.getElementById('pjTop');
      const botBtn = document.getElementById('pjBottom');
      let hideTimer = null;
      function showJumpers() {
        const scrollTop = window.scrollY || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = window.innerHeight;
        const isScrollable = scrollHeight > clientHeight + 50;
        const nearTop = scrollTop < 120;
        const nearBottom = scrollTop + clientHeight > scrollHeight - 120;
        topBtn.classList.toggle('hidden', nearTop || !isScrollable);
        botBtn.classList.toggle('hidden', nearBottom || !isScrollable);
      }
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { topBtn.classList.add('hidden'); botBtn.classList.add('hidden'); }, 2000);
      }
      function onScroll() { showJumpers(); scheduleHide(); }
      window.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', () => { showJumpers(); }, { passive: true });
      setTimeout(showJumpers, 300);
      function fastScrollTo(targetY) {
        const startY = window.scrollY || document.documentElement.scrollTop;
        const distance = targetY - startY;
        if (Math.abs(distance) < 2) {
          window.scrollTo(0, targetY);
          return;
        }
        const duration = 100;
        let startTime = null;
        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = timestamp - startTime;
          const t = Math.min(progress / duration, 1);
          const ease = 1 - Math.pow(1 - t, 3);
          window.scrollTo(0, startY + distance * ease);
          if (progress < duration) {
            requestAnimationFrame(animate);
          } else {
            window.scrollTo(0, targetY);
          }
        }
        requestAnimationFrame(animate);
      }
      topBtn.addEventListener('click', () => {
        const target = Math.max(0, (window.scrollY || document.documentElement.scrollTop) - window.innerHeight * 0.85);
        fastScrollTo(target);
      });
      botBtn.addEventListener('click', () => {
        const target = Math.min(document.documentElement.scrollHeight, (window.scrollY || document.documentElement.scrollTop) + window.innerHeight * 0.85);
        fastScrollTo(target);
      });
      [topBtn, botBtn].forEach(b => b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); } }));
    })();

    // Scroll-based stepper active
    let stepperScrollTimeout;
    window.addEventListener('scroll', () => {
      if (currentMode === 'history') return;
      clearTimeout(stepperScrollTimeout);
      stepperScrollTimeout = setTimeout(updateStepper, 50);
    }, { passive: true });

    // ─────────────────────────────────────────────────────────────────
    // CLOSE ALL POPUPS SCRIPT
    // ─────────────────────────────────────────────────────────────────
    function positionPopup(triggerEl, popupEl, isCalendar = false) {
      if (!triggerEl || !popupEl) return;
      const rect = triggerEl.getBoundingClientRect();
      const vh = window.innerHeight || document.documentElement.clientHeight;
      const vw = window.innerWidth || document.documentElement.clientWidth;
      const margin = 12;

      const stickyFooter = actionsBar && actionsBar.style.display !== 'none' ? actionsBar.getBoundingClientRect().height : 0;
      const stickyHeader = document.getElementById('stepperWrap')?.getBoundingClientRect().height || 0;
      const spaceBelow = (vh - stickyFooter) - rect.bottom - margin;
      const spaceAbove = (rect.top - stickyHeader) - margin;

      // Measure natural height (dropdowns max 220px, calendar ~290px)
      const defaultMax = isCalendar ? 310 : 220;
      const neededHeight = isCalendar
        ? Math.max(popupEl.scrollHeight || 0, 280)
        : Math.min(Math.max(popupEl.scrollHeight || 0, 44), defaultMax);

      const flipUp = spaceBelow < neededHeight && spaceAbove > spaceBelow;
      popupEl.classList.toggle('flip-up', flipUp);

      if (!isCalendar) {
        const avail = flipUp ? spaceAbove : spaceBelow;
        popupEl.style.maxHeight = Math.max(100, Math.min(defaultMax, Math.floor(avail))) + 'px';
      } else {
        const popW = popupEl.offsetWidth || 260;
        const spaceRight = vw - rect.left - margin;
        const spaceLeft = rect.right - margin;
        const flipRight = spaceRight < popW && spaceLeft > spaceRight;
        popupEl.classList.toggle('flip-right', flipRight);
      }
    }

    function repositionOpenPopups() {
      document.querySelectorAll('.custom-select-opts.open').forEach(opts => {
        const trig = opts.parentElement?.querySelector('.custom-select-trigger');
        if (trig) positionPopup(trig, opts, false);
      });
      document.querySelectorAll('.cal-pop.open').forEach(pop => {
        const trig = pop.parentElement?.querySelector('.date-trigger');
        if (trig) positionPopup(trig, pop, true);
      });
    }

    window.addEventListener('scroll', repositionOpenPopups, { passive: true });
    window.addEventListener('resize', repositionOpenPopups, { passive: true });

    function closeAllPopups() {
      document.querySelectorAll('.cal-pop.open').forEach(el => {
        el.classList.remove('open', 'flip-up', 'flip-right');
      });
      document.querySelectorAll('.date-trigger.active').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.custom-select-opts.open').forEach(el => {
        el.classList.remove('open', 'flip-up');
        el.style.maxHeight = '';
      });
      document.querySelectorAll('.custom-select-trigger.active').forEach(el => el.classList.remove('active'));
    }
    document.addEventListener('click', closeAllPopups);

    // ─────────────────────────────────────────────────────────────────
    // CALENDAR LOGIC (With SVGs & Mouse Scroll)
    // ─────────────────────────────────────────────────────────────────
    function renderCal(id) {
      const st = CAL[id], pop = document.getElementById('cp_' + id);
      if (!pop || !st) return;
      const y = st.year, m = st.month, now = new Date();

      if (st.view === 'years') {
        const startYear = y - 7;
        let h = `<div class="cal-nav">
      <button type="button" class="cpb-y" data-id="${id}" data-dir="-15" tabindex="0">${icons.chevronLeft}</button>
      <span class="mnth ys" tabindex="0">Select Year</span>
      <button type="button" class="cpb-y" data-id="${id}" data-dir="15" tabindex="0">${icons.chevronRight}</button>
    </div>
    <div class="cal-grid years">`;
        for (let i = 0; i < 15; i++) {
          h += `<div class="cd ${startYear + i === y ? 'sel' : ''}" data-id="${id}" data-y="${startYear + i}" tabindex="0">${startYear + i}</div>`;
        }
        h += '</div>';
        pop.innerHTML = h;

        pop.querySelectorAll('.cpb-y').forEach(b => {
          const action = e => { e.stopPropagation(); CAL[b.dataset.id].year += parseInt(b.dataset.dir); renderCal(b.dataset.id); };
          b.addEventListener('click', action);
          handleKeyClick(b, action);
        });
        pop.querySelectorAll('.cd').forEach(el => {
          const action = e => { e.stopPropagation(); CAL[el.dataset.id].year = parseInt(el.dataset.y); CAL[el.dataset.id].view = 'days'; renderCal(el.dataset.id); };
          el.addEventListener('click', action);
          handleKeyClick(el, action);
        });

      } else {
        const fd = new Date(y, m, 1).getDay();
        const dim = new Date(y, m + 1, 0).getDate(), prev = new Date(y, m, 0).getDate();

        let h = `<div class="cal-nav">
      <button type="button" class="cpb" data-id="${id}" data-dir="-1" tabindex="0">${icons.chevronLeft}</button>
      <span class="mnth ts" data-id="${id}" title="Click to change year" tabindex="0">${MONTHS[m]} ${y}</span>
      <button type="button" class="cpb" data-id="${id}" data-dir="1" tabindex="0">${icons.chevronRight}</button>
    </div>
    <div class="cal-grid">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map(x => `<div class="dn">${x}</div>`).join('')}`;
        for (let i = 0; i < fd; i++) h += `<div class="cd om">${prev - fd + 1 + i}</div>`;
        for (let d = 1; d <= dim; d++) {
          const iT = d === now.getDate() && m === now.getMonth() && y === now.getFullYear();
          const iS = st.date && d === st.date.getDate() && m === st.date.getMonth() && y === st.date.getFullYear();
          h += `<div class="cd${iT ? ' today' : ''}${iS ? ' sel' : ''}" data-id="${id}" data-d="${d}" tabindex="0">${d}</div>`;
        }
        h += `</div><div class="cal-foot"><button type="button" class="cal-foot-btn cal-today-btn" data-id="${id}">Today</button><button type="button" class="cal-foot-btn cal-clr-btn" data-id="${id}">Clear</button></div>`;
        pop.innerHTML = h;

        const todayBtn = pop.querySelector('.cal-today-btn');
        if (todayBtn) {
          todayBtn.addEventListener('click', e => {
            e.stopPropagation();
            const s = CAL[id], t = new Date();
            s.date = t; s.year = t.getFullYear(); s.month = t.getMonth();
            const f = allFields().find(x => x.id === id);
            const diEl = document.getElementById('di_' + id);
            if (diEl) diEl.value = f.fmt === 'slash' ? fmtSlash(t) : fmtDash(t);
            closeAllPopups(); updateStepper();
          });
        }
        const clrDateBtn = pop.querySelector('.cal-clr-btn');
        if (clrDateBtn) {
          clrDateBtn.addEventListener('click', e => {
            e.stopPropagation();
            CAL[id].date = null;
            const diEl = document.getElementById('di_' + id);
            if (diEl) diEl.value = '';
            closeAllPopups(); updateStepper();
          });
        }

        pop.querySelectorAll('.cpb').forEach(b => {
          const action = e => { e.stopPropagation(); const s = CAL[b.dataset.id], dir = parseInt(b.dataset.dir); s.month += dir; if (s.month < 0) { s.month = 11; s.year--; } if (s.month > 11) { s.month = 0; s.year++; } renderCal(b.dataset.id); };
          b.addEventListener('click', action);
          handleKeyClick(b, action);
        });

        const ts = pop.querySelector('.ts');
        const tsAction = e => { e.stopPropagation(); CAL[e.target.dataset.id].view = 'years'; renderCal(e.target.dataset.id); };
        ts.addEventListener('click', tsAction);
        handleKeyClick(ts, tsAction);

        pop.querySelectorAll('.cd:not(.om)').forEach(el => {
          const action = e => {
            e.stopPropagation(); const s = CAL[el.dataset.id]; s.date = new Date(s.year, s.month, parseInt(el.dataset.d));
            const f = allFields().find(f => f.id === el.dataset.id);
            const diEl = document.getElementById('di_' + el.dataset.id);
            if (diEl) { diEl.value = f.fmt === 'slash' ? fmtSlash(s.date) : fmtDash(s.date); }
            const dv = document.getElementById('dv_' + el.dataset.id);
            if (dv) { dv.textContent = f.fmt === 'slash' ? fmtSlash(s.date) : fmtDash(s.date); dv.classList.remove('empty'); }
            closeAllPopups(); renderCal(el.dataset.id); updateStepper();
          };
          el.addEventListener('click', action);
          handleKeyClick(el, action);
        });
      }
    }

    function openCal(id) {
      closeAllPopups();
      const ref = CAL[id]?.date || new Date();
      if (!CAL[id]) CAL[id] = { date: null, open: false, view: 'days' };
      CAL[id].year = ref.getFullYear(); CAL[id].month = ref.getMonth(); CAL[id].view = 'days';
      renderCal(id);
      const pop = document.getElementById('cp_' + id);
      const dt = document.getElementById('dt_' + id);
      if (pop && dt) {
        positionPopup(dt, pop, true);
        pop.classList.add('open');
        dt.classList.add('active');
      }
      CAL[id].open = true;
    }

    // ─────────────────────────────────────────────────────────────────
    // FORM BUILDER
    // ─────────────────────────────────────────────────────────────────
    function buildForm() {

      getGroups().forEach(group => {
        const sec = document.createElement('div'); sec.className = 'form-section';

            const datePh = f.fmt === 'slash' ? 'DD / MM / YYYY' : 'DD-MM-YYYY';

            col.innerHTML = `
          <label for="di_${f.id}">${f.label}</label>
          <div style="position:relative;">
            <div class="date-trigger" id="dt_${f.id}" style="cursor:text;">
              <input type="text" id="di_${f.id}" placeholder="${datePh}" autocomplete="off" style="flex:1;height:100%;border:none;border-radius:0;padding:0 8px 0 0;background:transparent;font-size:14px;color:var(--text-main);outline:none;box-shadow:none;font-family:'Inter',sans-serif;width:100%;cursor:text;" tabindex="0">
              <span class="date-icon" id="dico_${f.id}" tabindex="0" role="button" aria-label="Pick ${f.label}" style="cursor:pointer;flex-shrink:0;">${icons.calendar}</span>
            </div>
            <div class="cal-pop" id="cp_${f.id}"></div>
          </div>`;

            // Mouse wheel on cal-pop
            const calPop = col.querySelector('.cal-pop');
            let wheelTimeout;
            calPop.addEventListener('wheel', (e) => {
              e.preventDefault();
              if (wheelTimeout) return;
              wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 150);
              const st = CAL[f.id];
              if (st.view === 'years') { st.year += e.deltaY > 0 ? 15 : -15; }
              else { st.month += e.deltaY > 0 ? 1 : -1; if (st.month > 11) { st.month = 0; st.year++; } else if (st.month < 0) { st.month = 11; st.year--; } }
              renderCal(f.id);
            }, { passive: false });

            grid.appendChild(col);

            requestAnimationFrame(() => {
              const dt = document.getElementById('dt_' + f.id);
              const di = document.getElementById('di_' + f.id);
              const ico = document.getElementById('dico_' + f.id);
              // Manual typing (supports both DD-MM-YYYY and DD/MM/YYYY)
              di.addEventListener('input', () => {
                const d = parseManualDate(di.value);
                if (!CAL[f.id]) CAL[f.id] = { date: null, open: false, year: new Date().getFullYear(), month: new Date().getMonth(), view: 'days' };
                if (d) {
                  Object.assign(CAL[f.id], { date: d, year: d.getFullYear(), month: d.getMonth(), view: 'days' });
                } else {
                  CAL[f.id].date = null;
                }
                updateStepper();
              });
              di.addEventListener('blur', () => {
                dt.style.borderColor = ''; dt.style.boxShadow = '';
                const d = parseManualDate(di.value);
                if (d) di.value = f.fmt === 'slash' ? fmtSlash(d) : fmtDash(d);
              });
              di.addEventListener('focus', () => { dt.style.borderColor = 'var(--border-focus)'; dt.style.boxShadow = '0 0 0 3px var(--focus-ring)'; });
              const toggleCal = e => {
                e.stopPropagation();
                const isOpen = document.getElementById('cp_' + f.id)?.classList.contains('open');
                if (isOpen) closeAllPopups(); else openCal(f.id);
              };
              ico.addEventListener('click', toggleCal);
              handleKeyClick(ico, toggleCal);
              dt.addEventListener('click', e => { if (e.target !== ico && !ico.contains(e.target)) di.focus(); });
            });
          } else if (f.type === 'select') {
            col.innerHTML = `
          <label for="${f.id}">${f.label}</label>
          <div class="custom-select-wrap">
            <div class="custom-select-trigger" id="cst_${f.id}" style="cursor:text;">
              <input type="text" id="${f.id}" class="cs-input" placeholder="Select or type ${f.label}..." autocomplete="off" tabindex="0">
              <span class="cs-arr" id="csa_${f.id}" tabindex="0" role="button" aria-label="Toggle ${f.label} options">${icons.chevronDown}</span>
            </div>
            <div class="custom-select-opts" id="cso_${f.id}">
              ${f.options.map(o => `<div class="cs-opt" data-val="${o}" tabindex="0">${o}</div>`).join('')}
              <div class="cs-empty" id="cse_${f.id}" style="display:none;">No match in list — your typed text will be used</div>
            </div>
          </div>`;
            grid.appendChild(col);

            requestAnimationFrame(() => {
              const trig = document.getElementById('cst_' + f.id);
              const arr = document.getElementById('csa_' + f.id);
              const opts = document.getElementById('cso_' + f.id);
              const inp = document.getElementById(f.id);
              const emptyMsg = document.getElementById('cse_' + f.id);
              const optEls = Array.from(opts.querySelectorAll('.cs-opt'));

              const highlightMatch = (label, rawQuery) => {
                const q = rawQuery.trim();
                if (!q) return escHtml(label);
                const lowerLabel = label.toLowerCase();
                const lowerQ = q.toLowerCase();
                const idx = lowerLabel.indexOf(lowerQ);
                if (idx === -1) return escHtml(label);
                const before = escHtml(label.slice(0, idx));
                const match = escHtml(label.slice(idx, idx + q.length));
                const after = escHtml(label.slice(idx + q.length));
                return `${before}<mark class="cs-hl">${match}</mark>${after}`;
              };

              const filterOpts = (query) => {
                const rawQ = query.trim();
                const q = rawQ.toLowerCase();
                let visibleCount = 0;
                optEls.forEach(opt => {
                  const val = opt.getAttribute('data-val');
                  const match = !q || val.toLowerCase().includes(q);
                  opt.style.display = match ? '' : 'none';
                  if (match) {
                    opt.innerHTML = highlightMatch(val, rawQ);
                    visibleCount++;
                  }
                });
                if (emptyMsg) {
                  if (visibleCount === 0 && rawQ) {
                    emptyMsg.innerHTML = `Use custom: <strong>${escHtml(rawQ)}</strong>`;
                    emptyMsg.style.display = 'block';
                  } else {
                    emptyMsg.style.display = 'none';
                  }
                }
              };

              if (emptyMsg) {
                emptyMsg.addEventListener('click', e => {
                  e.stopPropagation();
                  closeAllPopups();
                  updateStepper();
                });
              }

              const openDropdown = (showAll = false) => {
                closeAllPopups();
                filterOpts(showAll ? '' : inp.value);
                positionPopup(trig, opts, false);
                opts.classList.add('open');
                trig.classList.add('active');
              };

              // Clicking arrow toggles full list
              const arrAction = e => {
                e.stopPropagation();
                const isOpen = opts.classList.contains('open');
                if (isOpen) {
                  closeAllPopups();
                } else {
                  openDropdown(true);
                }
              };
              arr.addEventListener('click', arrAction);
              handleKeyClick(arr, arrAction);

              // Clicking trigger focuses input and opens dropdown
              trig.addEventListener('click', e => {
                e.stopPropagation();
                if (e.target !== arr && !arr.contains(e.target)) {
                  inp.focus();
                  if (!opts.classList.contains('open')) openDropdown(false);
                }
              });

              // Typing filters & highlights options while allowing any custom text
              inp.addEventListener('input', () => {
                filterOpts(inp.value);
                positionPopup(trig, opts, false);
                if (!opts.classList.contains('open')) {
                  opts.classList.add('open');
                  trig.classList.add('active');
                }
                updateStepper();
              });

              inp.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                  closeAllPopups();
                } else if (e.key === 'ArrowDown') {
                  e.preventDefault();
                  if (!opts.classList.contains('open')) openDropdown(false);
                  const firstVisible = optEls.find(o => o.style.display !== 'none');
                  if (firstVisible) firstVisible.focus();
                } else if (e.key === 'Enter') {
                  closeAllPopups();
                }
              });

              optEls.forEach(opt => {
                const optAction = e => {
                  e.stopPropagation();
                  const chosen = opt.getAttribute('data-val');
                  inp.value = chosen;
                  if (f.id === 'recipient') {
                    const targetId = currentMode === 'tyre' ? 'tyreMake' : 'battMake';
                    const makeInp = document.getElementById(targetId);
                    if (makeInp && !makeInp.value.trim()) makeInp.value = chosen;
                  }
                  closeAllPopups();
                  updateStepper();
                };
                opt.addEventListener('click', optAction);
                handleKeyClick(opt, optAction);
              });
            });
          } else {
            const label = document.createElement('label'); label.htmlFor = f.id; label.textContent = f.label;
            const input = document.createElement('input'); input.type = 'text'; input.id = f.id; input.setAttribute('tabindex', '0');
            if (f.inputmode) input.setAttribute('inputmode', f.inputmode);
            if (f.upper) input.addEventListener('blur', () => { input.value = input.value.trim().toUpperCase(); });
            if (f.def) { input.value = f.def; input.classList.add('pre'); input.addEventListener('focus', () => input.classList.remove('pre')); }
            else input.placeholder = f.placeholder || 'Enter value\u2026';

            col.appendChild(label); col.appendChild(input); grid.appendChild(col);
          }
        });
        sec.appendChild(grid);
        formWrap.appendChild(sec);
      });
    }

    async function handleClearForm() {
      if (!(await customConfirm('Are you sure you want to clear the form?'))) return;
      formDraft = {};

      allFields().forEach(f => {
        if (f.type === 'date') {
          if (CAL[f.id]) Object.assign(CAL[f.id], { date: null, open: false, year: new Date().getFullYear(), month: new Date().getMonth(), view: 'days' });
          const di = document.getElementById('di_' + f.id);
          if (di) di.value = '';
          const dv = document.getElementById('dv_' + f.id);
          if (dv) { dv.textContent = 'Pick a date'; dv.classList.add('empty'); }
        } else if (f.type === 'select') {
          const inp = document.getElementById(f.id);
          if (inp) inp.value = '';
        } else {
          const inp = document.getElementById(f.id);
          if (!inp) return;
          if (f.def) { inp.value = f.def; inp.classList.add('pre'); } else inp.value = '';
        }
      });
      closeAllPopups();
      clearStatus();
      updateStepper();
    }
    btnClear.addEventListener('click', handleClearForm);

    // ─────────────────────────────────────────────────────────────────
    // DOCXTEMPLATER LOGIC 
    // ─────────────────────────────────────────────────────────────────
    const setInjectButtonsState = (busy) => {
      const iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>`;
      btnInject.disabled = busy;
      btnInject.innerHTML = busy ? 'Processing\u2026' : `${iconSvg} Generate DOCX`;
    };

    async function handleGenerateDocx() {
      setInjectButtonsState(true); clearStatus();

      try {
        await ensureLibrariesLoaded();
        if (!templateBuffers[currentFormat]) {
          await loadTemplate(currentFormat);
        }
        if (!templateBuffers[currentFormat]) { showStatus('Template not loaded yet.', 'error'); return; }

        const data = collectData();
        const histEntry = { ...data }; // Copy for history
        
        // Add docxtemplater specific flags
        data.isTyre = (currentMode === 'tyre');
        data.isBattery = (currentMode === 'battery');

        if (Object.keys(histEntry).length <= 2) { showStatus('Fill in at least one field.', 'error'); return; }

        if (typeof window.PizZip === 'undefined' || typeof window.docxtemplater === 'undefined') {
          throw new Error('Required Word template libraries could not be loaded. Check your internet connection.');
        }

        const zip = new window.PizZip(templateBuffers[currentFormat].slice(0));

        const doc = new window.docxtemplater(zip, {
          paragraphLoop: true,
          linebreaks: true,
          nullGetter: function () { return ""; }
        });

        // Add extra flags for template compatibility
        data.isTyreReport = data.isTyre;
        data.isBatteryReport = data.isBattery;

        doc.render(data);

        const blob = doc.getZip().generate({
          type: "blob",
          mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
        });

        const regNoClean = (data.regNo || 'NoReg').replace(/[^a-zA-Z0-9]/g, '');
        const makeClean = currentMode === 'tyre'
          ? (data.tyreMake || 'Make').replace(/[^a-zA-Z0-9]/g, '')
          : (data.battMake || 'Make').replace(/[^a-zA-Z0-9]/g, '');

        const name = `${regNoClean}_${makeClean}_lethead.docx`;
        saveAs(blob, name);

        showStatus('\u2713 Downloaded: ' + name, 'success');
        saveHistory(histEntry);
      } catch (err) {
        let msg = err.message;
        if (err.properties && err.properties.errors instanceof Array) {
          msg = err.properties.errors.map(function (e) { return e.properties.explanation || e.message; }).join(" | ");
        }
        showStatus('Error: ' + msg, 'error'); console.error(err);
      } finally {
        setInjectButtonsState(false);
      }
    }
    btnInject.addEventListener('click', handleGenerateDocx);

    // ─────────────────────────────────────────────────────────────────
    // HISTORY & SEARCH LOGIC
    // ─────────────────────────────────────────────────────────────────
    function saveHistory(entry) {
      if (entry.regNo) {
        HISTORY = HISTORY.filter(h => h.regNo !== entry.regNo);
      }
      HISTORY.unshift(entry);
      if (HISTORY.length > 50) HISTORY = HISTORY.slice(0, 50);
      try { localStorage.setItem('inj_hist', JSON.stringify(HISTORY)); } catch (e) { }
      renderHistory(historySearch.value);
    }
    async function deleteHistory(idx) {
      HISTORY.splice(idx, 1);
      try { localStorage.setItem('inj_hist', JSON.stringify(HISTORY)); } catch (e) { }
      renderHistory(historySearch.value);
    }

    document.getElementById('btnHistoryClearAll').addEventListener('click', async () => {
      if (!(await customConfirm('Are you sure you want to clear all saved entries?', 'Yes, Clear All'))) return;
      HISTORY = [];
      try { localStorage.removeItem('inj_hist'); } catch (e) { }
      historySearch.value = '';
      renderHistory();
    });

    historySearch.addEventListener('input', () => renderHistory(historySearch.value));

    function renderHistory(filterText = '') {
      if (!HISTORY.length) {
        histList.innerHTML = '<div style="text-align:center;font-size:12px;color:var(--text-muted);padding:10px;">No saved entries yet.</div>';
        return;
      }
      histList.innerHTML = '';
      const searchLower = filterText.toLowerCase().trim();

      HISTORY.forEach((entry, originalIdx) => {
        const primaryName = entry.regNo || entry.custName || 'Unknown Registration';
        const subMeta = entry.custName || entry.date || '';
        const fmtLabel = entry.format ? `(${entry.format})` : '';

        if (searchLower) {
          const searchString = `${primaryName} ${subMeta} ${entry.mode} ${entry.format || ''}`.toLowerCase();
          if (!searchString.includes(searchLower)) return;
        }

        const item = document.createElement('div'); item.className = 'hist-item'; item.setAttribute('tabindex', '0');
        item.innerHTML = `<div class="hi-info">
      <div class="hi-name">${escHtml(primaryName)}</div>
      <div class="hi-meta"><span class="hi-mode ${entry.mode}">${entry.mode}</span> <span style="text-transform:lowercase;opacity:0.6;font-size:11px;">${fmtLabel}</span> ${escHtml(subMeta)}</div>
    </div><button type="button" class="hi-del" data-idx="${originalIdx}" tabindex="0">${icons.close}</button>`;

        const delBtn = item.querySelector('.hi-del');
        const delAction = async e => {
          e.stopPropagation();
          if (!(await customConfirm('Are you sure you want to delete this entry?', 'Delete'))) return;
          deleteHistory(originalIdx);
        };
        delBtn.addEventListener('click', delAction);
        handleKeyClick(delBtn, delAction);

        const itemAction = () => fillFromHistory(entry);
        item.addEventListener('click', itemAction);
        handleKeyClick(item, itemAction);

        histList.appendChild(item);
      });

      if (histList.innerHTML === '') {
        histList.innerHTML = '<div style="text-align:center;font-size:12px;color:var(--text-muted);padding:10px;">No matching entries found.</div>';
      }
    }

    async function fillFromHistory(entry) {
      formDraft = {};
      if (entry.format) await setFormat(entry.format);
      setMode(entry.mode || 'tyre');

      requestAnimationFrame(() => {
        dateFields().forEach(f => {
          const val = entry[f.id];
          if (!val) return;
          const di = document.getElementById('di_' + f.id);
          if (di) di.value = val;
          const d = parseManualDate(val);
          if (d) {
            if (!CAL[f.id]) CAL[f.id] = {};
            Object.assign(CAL[f.id], { date: d, year: d.getFullYear(), month: d.getMonth(), open: false, view: 'days' });
          }
        });
        allFields().filter(f => f.type === 'text' || f.type === 'select').forEach(f => {
          const inp = document.getElementById(f.id);
          if (inp && entry[f.id] !== undefined) {
            inp.value = entry[f.id];
            inp.classList.remove('pre');
          }
        });
        closeAllPopups();
        clearStatus();
        updateStepper();
      });
    }

    function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function showStatus(m, t) { statusEl.textContent = m; statusEl.className = 'status ' + t; }
    function clearStatus() { statusEl.textContent = ''; statusEl.className = 'status'; }


    // ─────────────────────────────────────────────────────────────────
    // THEME SYNC WITH PARENT WINDOW via postMessage
    // ─────────────────────────────────────────────────────────────────
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'theme') {
        document.documentElement.setAttribute('data-theme', event.data.theme);
      }
      if (event.data && event.data.type === 'backup-request') {
        const keys = ['inj_hist'];
        const payload = {};
        keys.forEach(k => {
          try { const v = localStorage.getItem(k); if (v) payload[k] = v; } catch (e) { }
        });
        event.source.postMessage({ type: 'backup-response', tool: 'letterheads', data: payload }, '*');
      }
      if (event.data && event.data.type === 'restore-data') {
        if (event.data.tool === 'letterheads' && event.data.data) {
          Object.entries(event.data.data).forEach(([k, v]) => {
            try { localStorage.setItem(k, v); } catch (e) { }
          });
          // Reload history
          try { HISTORY = JSON.parse(localStorage.getItem('inj_hist') || '[]'); } catch (e) { }
          renderHistory();
        }
      }
    });

    // Request initial theme from parent
    window.parent.postMessage({ type: 'requestTheme' }, '*');

  </script>
</body>
